<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Games">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#e9f1ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Games</title>
<style>
:root{
  --bg1:#e9f1ff; --bg2:#fdf0f6;
  --card:#ffffffd9; --solid:#fff; --ink:#1c1c1e; --ink2:#6e6e73; --soft:#8e8e9326;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --pink:#ff375f; --purple:#bf5af2; --yellow:#ffd60a; --teal:#40c8e0;
  /* The stage is always the biggest square that fits: HomeView has a 1:1 screen */
  --s:min(100vw,100dvh);
  --u:calc(var(--s)/100);
  --font:ui-rounded,"SF Pro Rounded",-apple-system,"SF Pro Display",system-ui,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg1:#101a33;--bg2:#2a1630;--card:#2c2c2ed9;--solid:#3a3a3c;--ink:#f5f5f7;--ink2:#a1a1a6;--soft:#ffffff1f}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);color:var(--ink);
  background:radial-gradient(120% 90% at 10% 0%,var(--bg1),transparent 60%),radial-gradient(120% 90% at 100% 100%,var(--bg2),transparent 60%),var(--bg1);
  display:grid;place-items:center;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#stage{width:var(--s);height:var(--s);position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*5);
  transition:opacity .3s ease,transform .4s cubic-bezier(.2,.9,.25,1.1)}
.screen.hidden{opacity:0;transform:scale(.92);pointer-events:none}

/* ---------- Home ---------- */
#home{padding-left:0;padding-right:0}
.home-top{display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*5);flex:none}
.hello{font-size:calc(var(--u)*6.6);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:calc(var(--u)*3.3);color:var(--ink2);font-weight:600;margin-top:calc(var(--u)*.6)}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:calc(var(--u)*2) calc(var(--u)*6) 0;align-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.3);touch-action:pan-x}
.icon{width:calc(var(--u)*18);aspect-ratio:1;border-radius:calc(var(--u)*4.2);display:grid;place-items:center;
  font-size:calc(var(--u)*10.4);position:relative;
  box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) #00000026, inset 0 calc(var(--u)*.3) 0 #ffffff66;
  transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.icon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#ffffff40,transparent 50%)}
.app:active .icon{transform:scale(.9)}
.label{font-size:calc(var(--u)*3.5);font-weight:700;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:calc(var(--u)*1.6);height:calc(var(--u)*4);align-items:center;flex:none}
.dots i{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;background:var(--ink);opacity:.2;transition:opacity .2s}
.dots i.on{opacity:.75}

.round{width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 calc(var(--u)*.8) calc(var(--u)*3) #0000001f;font-size:calc(var(--u)*5.4);transition:transform .2s}
.round:active{transform:scale(.88)}
.round svg{width:46%;height:46%}

/* ---------- Game shell ---------- */
.bar{display:flex;align-items:center;gap:calc(var(--u)*1.8);height:calc(var(--u)*12);flex:none}
.title{flex:1;min-width:0;font-size:calc(var(--u)*4.5);font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{display:flex;gap:calc(var(--u)*1.6);flex:none}
.pill{background:var(--card);border-radius:999px;padding:0 calc(var(--u)*2.6);height:calc(var(--u)*9.6);display:flex;align-items:center;gap:calc(var(--u)*1);
  font-size:calc(var(--u)*4.1);font-weight:800;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.4) #00000014;font-variant-numeric:tabular-nums;white-space:nowrap}
.play{flex:1;min-height:0;margin-top:calc(var(--u)*3);position:relative;display:grid;place-items:center}
.cardbg{background:var(--card);border-radius:calc(var(--u)*5);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.4) #00000014}
.hint{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:#000000b0;color:#fff;border-radius:999px;padding:calc(var(--u)*1.6) calc(var(--u)*4);
  font-size:calc(var(--u)*4);font-weight:700;white-space:nowrap;pointer-events:none;z-index:3;animation:hint 3.2s ease forwards}
.hint.low{top:auto;bottom:6%}
@keyframes hint{0%{opacity:0}10%,75%{opacity:1}100%{opacity:0}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--u)*30);font-weight:900;color:var(--blue);z-index:3;background:#ffffff55;border-radius:calc(var(--u)*5)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4%)}75%{transform:translateX(4%)}}

/* Result sheet */
.sheet{position:absolute;inset:0;display:grid;place-items:center;background:#0000002e;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.sheet.show{opacity:1;pointer-events:auto}
.sheet-card{background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:calc(var(--u)*8);
  width:calc(var(--u)*76);padding:calc(var(--u)*7) calc(var(--u)*6);text-align:center;
  transform:scale(.85);transition:transform .45s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 calc(var(--u)*3) calc(var(--u)*10) #00000033}
.sheet.show .sheet-card{transform:scale(1)}
.big-emoji{font-size:calc(var(--u)*20);line-height:1}
.sheet h2{font-size:calc(var(--u)*8);font-weight:800;margin:calc(var(--u)*2) 0 calc(var(--u)*1)}
.sheet p{font-size:calc(var(--u)*4.6);color:var(--ink2);font-weight:600;white-space:pre-line;line-height:1.35}
.btns{display:flex;gap:calc(var(--u)*3);justify-content:center;margin-top:calc(var(--u)*6)}
.btn{height:calc(var(--u)*13);padding:0 calc(var(--u)*6);border-radius:999px;font-size:calc(var(--u)*5.2);font-weight:800;
  background:var(--blue);color:#fff;box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) #0a84ff55;transition:transform .2s;display:flex;align-items:center;gap:calc(var(--u)*1.5);white-space:nowrap}
.btn.gray{background:var(--soft);color:var(--ink);box-shadow:none}
.btn:active{transform:scale(.92)}
.confetti{position:absolute;top:-5%;width:calc(var(--u)*2.2);height:calc(var(--u)*3.4);border-radius:2px;z-index:4;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(var(--s)*1.15)) rotate(720deg)}}

/* Mode chooser */
.modes{display:flex;flex-direction:column;gap:calc(var(--u)*4);width:calc(var(--u)*72)}
.mode{display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*4) calc(var(--u)*5);border-radius:calc(var(--u)*6);background:var(--card);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) #00000018;font-size:calc(var(--u)*5.6);font-weight:800;transition:transform .2s;text-align:left}
.mode:active{transform:scale(.95)}
.mode .e{font-size:calc(var(--u)*11)}
.mode small{display:block;font-size:calc(var(--u)*3.6);color:var(--ink2);font-weight:600}

/* Quiz layout (shared by several games) */
.quiz{width:100%;height:100%;display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.q-prompt{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:calc(var(--u)*1.5);
  font-size:calc(var(--u)*11);font-weight:800;padding:calc(var(--u)*3);text-align:center;line-height:1.1}
.q-prompt small{display:block;width:100%;font-size:calc(var(--u)*4.2);color:var(--ink2);font-weight:700}
.q-choices{display:grid;gap:calc(var(--u)*3);height:calc(var(--u)*24);flex:none}
.q-choices.fill{flex:1;height:auto;min-height:0}
.q-btn{background:var(--solid);border-radius:calc(var(--u)*4.5);font-size:calc(var(--u)*11);font-weight:800;display:grid;place-items:center;min-height:0;
  box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) #0000001c;transition:transform .2s,opacity .2s}
.q-btn:active{transform:scale(.94)}
.q-btn.off{opacity:.35}
.q-btn.right{box-shadow:0 0 0 calc(var(--u)*1.1) var(--green) inset;animation:bump .5s ease}
@keyframes bump{50%{transform:scale(1.1)}}
.shadow{filter:brightness(0);font-size:calc(var(--u)*26);transition:filter .4s}
@media (prefers-color-scheme:dark){.shadow{filter:brightness(0) invert(.75)}}
.shadow.lit{filter:none}

/* Flip Flip */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*2.6);width:100%;height:100%}
.mcard{perspective:800px;position:relative}
.mcard-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.9,.3,1.1)}
.mcard.open .mcard-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--u)*4);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;
  box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) #00000022}
.f-back{background:linear-gradient(160deg,#5ac8fa,#0a84ff)}
.f-back::before{content:"?";font-size:calc(var(--u)*9);font-weight:900;color:#ffffffb0}
.f-front{background:var(--solid);transform:rotateY(180deg);font-size:calc(var(--u)*12)}
.mcard.done .f-front{box-shadow:0 0 0 calc(var(--u)*1) var(--green) inset}

/* Boards */
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*2.2);height:100%;aspect-ratio:1;
  background:#ff9f0a33;padding:calc(var(--u)*2.2);border-radius:calc(var(--u)*6)}
.cell{background:var(--card);border-radius:calc(var(--u)*4);display:grid;place-items:center;font-size:calc(var(--u)*13);box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.6) #00000014;min-height:0}
.cell span{animation:drop .4s cubic-bezier(.2,.9,.3,1.5)}
.cell.win,.d4c.win{animation:glow .6s ease infinite alternate}
@keyframes drop{from{transform:scale(0) rotate(-30deg)}}
@keyframes glow{to{box-shadow:0 0 0 calc(var(--u)*1.2) var(--green) inset;transform:scale(1.06)}}
.d4{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:calc(var(--u)*1.4);height:100%;aspect-ratio:7/6;
  background:linear-gradient(160deg,#5ac8fa,#0a84ff);padding:calc(var(--u)*2);border-radius:calc(var(--u)*5)}
.d4c{border-radius:50%;background:#ffffffe6;min-height:0;box-shadow:inset 0 calc(var(--u)*.5) calc(var(--u)*1) #00000026}
.d4c.p1{background:var(--pink);animation:fallin .35s ease-out}
.d4c.p2{background:var(--yellow);animation:fallin .35s ease-out}
@keyframes fallin{from{transform:translateY(-300%)}}

/* Chick Pop */
.field{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*3);width:100%;height:100%}
.hole{position:relative;border-radius:calc(var(--u)*5);overflow:hidden;min-height:0;
  background:radial-gradient(70% 30% at 50% 88%,#7a4a1f 0 60%,transparent 62%),linear-gradient(180deg,#bdf0c4,#86d996)}
@media (prefers-color-scheme:dark){.hole{background:radial-gradient(70% 30% at 50% 88%,#3b230e 0 60%,transparent 62%),linear-gradient(180deg,#2c5a35,#1f4026)}}
.critter{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:calc(var(--u)*14);line-height:1;
  transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.9,.3,1.3);pointer-events:none}
.hole.up .critter{transform:translateY(0)}
.hole.hit .critter{transform:translateY(0) scale(1.2)}
.burst{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--u)*9);font-weight:900;color:var(--orange);
  pointer-events:none;animation:burst .6s ease forwards;text-shadow:0 2px 0 #fff}
@keyframes burst{from{transform:scale(.4);opacity:1}to{transform:translateY(-40%) scale(1.2);opacity:0}}

/* Color Echo */
.pads{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--u)*3);height:100%;aspect-ratio:1}
.pad{border-radius:calc(var(--u)*7);opacity:.55;transition:opacity .12s,transform .12s;min-height:0;box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) #00000022}
.pad.lit{opacity:1;transform:scale(1.05)}

/* Balloon Pop */
.sky{width:100%;height:100%;position:relative;overflow:hidden;border-radius:calc(var(--u)*5);background:linear-gradient(180deg,#bfe6ff,#eaf7ff)}
@media (prefers-color-scheme:dark){.sky{background:linear-gradient(180deg,#14304d,#1d2a44)}}
.balloon{position:absolute;top:100%;width:calc(var(--u)*17);height:calc(var(--u)*21);border-radius:50% 50% 50% 50%/45% 45% 55% 55%;
  box-shadow:inset calc(var(--u)*-1.5) calc(var(--u)*-1.5) calc(var(--u)*3) #00000022, inset calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*3) #ffffff66;
  animation:floatup linear forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:calc(var(--u)*7);background:#00000033}
.balloon.pop{animation:popped .2s ease forwards!important}
@keyframes floatup{to{top:-35%}}
@keyframes popped{to{transform:scale(1.5);opacity:0}}

/* Slide It */
.slide{position:relative;height:100%;aspect-ratio:1;background:#bf5af233;border-radius:calc(var(--u)*6)}
.tile{position:absolute;width:31.33%;height:31.33%;border-radius:calc(var(--u)*4);background:linear-gradient(160deg,#da8fff,#bf5af2);color:#fff;
  font-size:calc(var(--u)*13);font-weight:900;display:grid;place-items:center;transition:left .18s ease,top .18s ease;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) #00000026}

/* Sleepy Stars */
.stars{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*2.4);height:100%;aspect-ratio:1}
.star{border-radius:calc(var(--u)*5);background:#1c2a4d;font-size:calc(var(--u)*13);display:grid;place-items:center;min-height:0;transition:background .25s,transform .2s;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) #00000026}
.star::before{content:"💤";opacity:.5;font-size:.7em}
.star.on{background:linear-gradient(160deg,#fff3a6,#ffd60a)}
.star.on::before{content:"⭐";opacity:1;font-size:1em}
.star:active{transform:scale(.94)}

/* Rock Paper */
.rps{width:100%;height:100%;display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.rps-top{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;padding:calc(var(--u)*2)}
.rps-hand{font-size:calc(var(--u)*22);line-height:1}
.rps-hand.wait{animation:wob .25s ease-in-out infinite alternate}
@keyframes wob{to{transform:translateY(-12%) rotate(-12deg)}}
.rps-top small{display:block;text-align:center;font-size:calc(var(--u)*4);font-weight:800;color:var(--ink2);margin-top:calc(var(--u)*1.5)}
.rps-msg{font-size:calc(var(--u)*5.4);font-weight:900;min-width:calc(var(--u)*20);text-align:center}

/* Snack Snake */
.snk{position:relative;width:100%;aspect-ratio:11/9;max-height:100%;border-radius:calc(var(--u)*4);overflow:hidden;
  background:repeating-conic-gradient(#c9f2cf 0 25%,#b5eabc 0 50%) 0 0/calc(200%/11) calc(200%/9)}
@media (prefers-color-scheme:dark){.snk{background:repeating-conic-gradient(#234a2b 0 25%,#1d3f25 0 50%) 0 0/calc(200%/11) calc(200%/9)}}
.snk i{position:absolute;width:calc(100%/11);height:calc(100%/9);display:grid;place-items:center;font-style:normal;font-size:calc(var(--u)*6);line-height:1}
.snk .sb{background:#30b158;border-radius:32%;transform:scale(.9)}
.snk .sh{background:#1f8a43;border-radius:38%;z-index:1}
.snk .sh::before{content:"";width:60%;height:22%;background:radial-gradient(circle at 20% 50%,#fff 0 18%,transparent 20%),radial-gradient(circle at 80% 50%,#fff 0 18%,transparent 20%)}

/* Lanes / runners */
.world{position:relative;width:100%;height:100%;overflow:hidden;border-radius:calc(var(--u)*5);background:linear-gradient(180deg,#bfe6ff,#eaf7ff);touch-action:none}
@media (prefers-color-scheme:dark){.world{background:linear-gradient(180deg,#14304d,#1d2a44)}}
.world .ground{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#7ed08a,#4fb062)}
.spr{position:absolute;line-height:1;transform:translate(-50%,-50%);pointer-events:none;will-change:left,top}
.lane{position:absolute;top:0;bottom:0;width:33.34%}
.lane+.lane{border-left:2px dashed #0000001a}
.pipe{position:absolute;width:13%;background:linear-gradient(90deg,#34c759,#7ee787 45%,#30b158);border-radius:calc(var(--u)*2.5);box-shadow:inset 0 0 0 calc(var(--u)*.6) #1f8a4366}
.blk{position:absolute;height:9%;border-radius:calc(var(--u)*1.6);transition:bottom .25s ease;box-shadow:inset 0 calc(var(--u)*.6) 0 #ffffff55}

/* Piano */
.piano{display:flex;gap:calc(var(--u)*1.4);width:100%;height:100%;touch-action:none}
.key{flex:1;border-radius:calc(var(--u)*3.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--u)*4);
  font-size:calc(var(--u)*6);font-weight:900;color:#fff;box-shadow:0 calc(var(--u)*1) calc(var(--u)*2.4) #00000026,inset 0 calc(var(--u)*.5) 0 #ffffff55;transition:transform .08s,filter .08s;transform-origin:top}
.key.down{transform:scaleY(.96);filter:brightness(1.25)}

/* Doodle */
.doodle{width:100%;height:100%;display:flex;flex-direction:column;gap:calc(var(--u)*2.4)}
.pal{display:flex;gap:calc(var(--u)*1.7);padding-top:calc(var(--u)*1);justify-content:center;flex:none}
.sw{width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2) #00000026;transition:transform .15s;display:grid;place-items:center;font-size:calc(var(--u)*5.4);background:var(--card)}
.sw.on{transform:scale(1.18);box-shadow:0 0 0 calc(var(--u)*.8) var(--solid),0 0 0 calc(var(--u)*1.5) var(--ink)}
.doodle canvas{flex:1;min-height:0;width:100%;background:#fff;border-radius:calc(var(--u)*5);touch-action:none;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.4) #00000014}

/* Number Trail */
.trail{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*2.6);width:100%;height:100%}
.num{border-radius:calc(var(--u)*5);background:linear-gradient(160deg,#70d7ff,#0a84ff);color:#fff;font-size:calc(var(--u)*12);font-weight:900;min-height:0;
  box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) #00000022;transition:transform .2s,opacity .3s}
.num.done{opacity:.18;transform:scale(.85)}

/* Spell It */
.spell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
.sp-pic{font-size:calc(var(--u)*24);line-height:1.1}
.sp-row{display:flex;gap:calc(var(--u)*2.4);justify-content:center}
.slot,.ltr{width:calc(var(--u)*14);height:calc(var(--u)*16);border-radius:calc(var(--u)*3.6);display:grid;place-items:center;font-size:calc(var(--u)*10);font-weight:900}
.slot{background:var(--soft);box-shadow:inset 0 0 0 calc(var(--u)*.6) #8e8e9355}
.slot.full{background:var(--green);color:#fff;box-shadow:none;animation:bump .3s}
.ltr{background:var(--solid);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) #00000022;transition:transform .15s,opacity .2s}
.ltr:active{transform:scale(.92)}
.ltr.used{opacity:0;pointer-events:none}

.pill.on{box-shadow:0 0 0 calc(var(--u)*.7) var(--orange)}
/* Two-player duels: players sit side by side, so the screen splits left and right */
.duel{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2)}
.side{border-radius:calc(var(--u)*5);display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--u)*7);font-size:calc(var(--u)*20);line-height:1;min-height:0;touch-action:none;transition:filter .1s}
.side small{font-size:calc(var(--u)*4.6);font-weight:900;margin-top:calc(var(--u)*2);color:var(--ink2)}
.s1{background:#0a84ff38}.s2{background:#ff375f38}
.side:active{filter:brightness(1.15)}
.side.won{box-shadow:inset 0 0 0 calc(var(--u)*1.2) var(--green)}
.rope{position:absolute;left:6%;right:6%;top:72%;height:calc(var(--u)*1.8);background:#a0703c;border-radius:calc(var(--u)*1);pointer-events:none}
.rope b{position:absolute;left:50%;top:50%;transform:translate(-50%,-75%);font-size:calc(var(--u)*12);transition:left .12s ease-out}
.signal{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:#ff453a;color:#fff;
  display:grid;place-items:center;font-size:calc(var(--u)*10);font-weight:900;pointer-events:none;box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) #00000040;transition:transform .12s}
.signal.go{background:var(--green);transform:translate(-50%,-50%) scale(1.12)}
.signal.idle{background:#8e8e93}
/* Box Battle */
.boxes{position:relative;height:100%;aspect-ratio:1}
.bx{position:absolute;display:grid;place-items:center;font-size:calc(var(--u)*11);border-radius:calc(var(--u)*2);transition:background .3s}
.ln{position:absolute;display:flex;align-items:center;justify-content:center}
.ln.h{height:13%;transform:translateY(-50%)}
.ln.v{width:13%;transform:translateX(-50%)}
.ln i{background:#8e8e9344;border-radius:99px;transition:background .2s}
.ln.h i{width:80%;height:calc(var(--u)*2.2)}
.ln.v i{height:80%;width:calc(var(--u)*2.2)}
.dot{position:absolute;width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);pointer-events:none}
/* Draw & Guess */
.chip{height:calc(var(--u)*9);padding:0 calc(var(--u)*3);border-radius:999px;background:var(--card);font-size:calc(var(--u)*3.9);font-weight:800;white-space:nowrap;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2) #00000026;touch-action:none}
.chip.ok{background:var(--green);color:#fff}
.chip:active{transform:scale(.94)}
.cvwrap{flex:1;min-height:0;position:relative}
.cvwrap canvas{position:absolute;inset:0;height:100%}
.secret{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--solid);border-radius:calc(var(--u)*5);font-size:calc(var(--u)*9);font-weight:900;line-height:1.2}
.secret.show{display:flex}
.secret span{font-size:calc(var(--u)*26)}
/* Dice Race */
.race{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
.track{position:relative;width:100%;height:calc(var(--u)*20);background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/15 - 2px),#8e8e9340 0 calc(100%/15))}
.track.on{box-shadow:0 0 0 calc(var(--u)*.8) var(--orange)}
.track b{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:calc(var(--u)*13);line-height:1;transition:left .5s cubic-bezier(.3,1.4,.5,1);padding-left:calc(var(--u)*1.5)}
.track u{position:absolute;right:calc(var(--u)*1.5);top:50%;transform:translateY(-50%);font-size:calc(var(--u)*9);text-decoration:none;opacity:.8}
.die{width:calc(var(--u)*27);height:calc(var(--u)*27);border-radius:calc(var(--u)*6);background:var(--solid);font-size:calc(var(--u)*17);font-weight:900;box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) #00000030;transition:transform .15s}
.die:active{transform:scale(.92)}

@media (prefers-reduced-motion:reduce){.confetti{display:none}}
</style>
</head>
<body>
<div id="stage">

  <section class="screen" id="home">
    <div class="home-top">
      <div>
        <div class="hello" id="hello">Hello!</div>
        <div class="sub">Tap a game to play</div>
      </div>
      <button class="round" id="soundBtn" aria-label="Sound on or off">🔊</button>
    </div>
    <div class="pager" id="pager"></div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="screen hidden" id="game">
    <div class="bar">
      <button class="round" id="backBtn" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="title" id="title"></div>
      <div id="hud"></div>
      <button class="round" id="againBtn" aria-label="Start again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/></svg></button>
    </div>
    <div class="play" id="play"></div>
  </section>

  <div class="sheet" id="sheet">
    <div class="sheet-card">
      <div class="big-emoji" id="sheetEmoji">🎉</div>
      <h2 id="sheetTitle"></h2>
      <p id="sheetText"></p>
      <div class="btns">
        <button class="btn gray" id="sheetHome">🏠 Home</button>
        <button class="btn" id="sheetAgain">↻ Again</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const rnd=n=>Math.random()*n|0;
const pick=a=>a[rnd(a.length)];
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pill=(icon,text,on)=>`<div class="pill${on?' on':''}">${icon} <span>${text}</span></div>`;
const COLORS=['#ff375f','#ff9f0a','#ffd60a','#30d158','#40c8e0','#0a84ff','#bf5af2'];

/* ---------- Sound: synthesised on the device, nothing is downloaded ---------- */
let actx=null, soundOn=true;
try{soundOn=localStorage.getItem('sound')!=='off'}catch(e){}
function tone(freqs,dur=.12,type='sine',vol=.18,force=false){
  if(!soundOn&&!force)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime;
    freqs.forEach(f=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;
    });
  }catch(e){}
}
const sfx={
  tap:()=>tone([660],.07,'triangle',.12),
  good:()=>tone([660,880],.12),
  bad:()=>tone([300,240],.12,'triangle',.12),
  win:()=>tone([523,659,784,1047],.16),
  pop:()=>tone([880+Math.random()*300],.08,'square',.06),
};
const soundBtn=$('#soundBtn');
const paintSound=()=>soundBtn.textContent=soundOn?'🔊':'🔇';
paintSound();
soundBtn.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('sound',soundOn?'on':'off')}catch(e){}paintSound();sfx.tap()};

const hr=new Date().getHours();
$('#hello').textContent=hr<12?'Good morning!':hr<18?'Good afternoon!':'Good evening!';

/* ---------- Result sheet ---------- */
let againFn=null;
function showSheet(emoji,title,text,again){
  $('#sheetEmoji').textContent=emoji;$('#sheetTitle').textContent=title;$('#sheetText').textContent=text;
  againFn=again;$('#sheet').classList.add('show');
}
function hideSheet(){$('#sheet').classList.remove('show');document.querySelectorAll('.confetti').forEach(c=>c.remove())}
function confetti(){
  for(let i=0;i<40;i++){
    const c=el('div','confetti');
    c.style.left=Math.random()*100+'%';c.style.background=COLORS[i%7];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';c.style.animationDelay=Math.random()*.4+'s';
    $('#stage').appendChild(c);setTimeout(()=>c.remove(),3500);
  }
}

/* ---------- Shared helpers for games ---------- */
const lastMode={};
function choose(c,opts,cb){
  if(c.again&&lastMode[c.id])return cb(lastMode[c.id]);   // "Again" keeps the same players
  c.el.innerHTML=`<div class="modes">${opts.map(o=>`<button class="mode" data-m="${o.m}"><span class="e">${o.e}</span><span>${o.t}<small>${o.s}</small></span></button>`).join('')}</div>`;
  c.el.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{sfx.tap();lastMode[c.id]=x.dataset.m;cb(x.dataset.m)});
}
function modes(c,a,b,cb,duo){
  choose(c,[{m:'cpu',e:'🤖',t:'Play the Robot',s:`You are ${a}`},{m:'duo',e:'👫',t:'Two Players',s:duo||`${a} and ${b} take turns`}],cb);
}
/* Family scoreboard: wins are kept while the page stays open, and players take turns going first */
const tally={},starts={};
function versusEnd(c,mode,turn,icons,key){
  const t=tally[key+mode]=tally[key+mode]||{1:0,2:0};t[turn]++;
  const line=`${icons[1]} ${t[1]} – ${t[2]} ${mode==='cpu'?'🤖':icons[2]}`;
  if(mode==='cpu'&&turn===2)c.end('🤖','Robot wins','Nice try. Play again!\n'+line,false);
  else c.end(icons[turn],mode==='cpu'?'You win!':icons[turn]+' wins!',line,true);
}
function pad(c,cv,getColor){
  const g=cv.getContext('2d');let last=null;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;g.lineCap=g.lineJoin='round';g.lineWidth=r.width/38*d};
  c.after(fit,450);   // wait for the screen transition so the size is final
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{last=pt(e);g.strokeStyle=getColor();g.beginPath();g.moveTo(last.x,last.y);g.lineTo(last.x+.1,last.y+.1);g.stroke();try{cv.setPointerCapture(e.pointerId)}catch(x){}});
  cv.addEventListener('pointermove',e=>{if(!last)return;const q=pt(e);g.strokeStyle=getColor();g.beginPath();g.moveTo(last.x,last.y);g.lineTo(q.x,q.y);g.stroke();last=q});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>last=null));
  return{clear:()=>g.clearRect(0,0,cv.width,cv.height)};
}
function quiz(c,{rounds=8,make}){
  let r=0,score=0;
  const next=()=>{
    if(r>=rounds)return c.end(score>=rounds-1?'🏆':'🌟',score>=rounds-1?'Amazing!':'Well done!',`You got ${score} of ${rounds} right`,true);
    r++;c.hud(pill('⭐',score+'/'+rounds));
    const q=make(r);let first=true,done=false;
    c.el.innerHTML='';const wrap=el('div','quiz');
    if(q.prompt)wrap.append(el('div','q-prompt cardbg',q.prompt));
    const row=el('div','q-choices'+(q.prompt?'':' fill'));
    row.style.gridTemplateColumns=`repeat(${q.cols||q.choices.length},1fr)`;
    q.choices.forEach((h,i)=>{
      const b=el('button','q-btn',h);if(q.size)b.style.fontSize=`calc(var(--u)*${q.size})`;
      b.onclick=()=>{
        if(done||b.classList.contains('off'))return;
        if(i===q.answer){done=true;b.classList.add('right');sfx.good();if(first)score++;q.right&&q.right(wrap);
          c.hud(pill('⭐',score+'/'+rounds));c.after(next,900)}
        else{first=false;b.classList.add('off','shake');sfx.bad()}
      };row.append(b)});
    wrap.append(row);c.el.append(wrap);
  };
  next();
}
function numberChoices(ans,min=0,max=20){
  const s=new Set([ans]);
  while(s.size<3){const v=ans+rnd(7)-3;if(v>=min&&v<=max)s.add(v)}
  const a=shuffle([...s]);return{choices:a.map(String),answer:a.indexOf(ans)};
}
const ANIMALS=['🐶','🐱','🐰','🦊','🐼','🐸','🐵','🦁','🐯','🐨','🐷','🐙','🦄','🐳'];
const THINGS=['🍎','🍌','🍓','🐟','🦋','🌸','⭐','🚗','🎈','🐞','🍪','🐢'];

/* ================= Games ================= */
const G=[

{id:'flip',name:'Flip Flip',icon:'🃏',bg:['#5ac8fa','#0a84ff'],init(c){
  choose(c,[{m:'solo',e:'🧒',t:'One Player',s:'Find all the pairs'},{m:'duo',e:'👫',t:'Two Players',s:'Take turns. A match gives you another go'}],mode=>{
    const P={1:'🐻',2:'🦊'},sc={1:0,2:0};let lock=true,open=[],pairs=0,tries=0,turn=1;
    c.el.innerHTML='';const g=el('div','mem');c.el.append(g);
    const hud=()=>c.hud(mode==='solo'?pill('⭐',pairs+'/6'):pill(P[1],sc[1],turn===1)+pill(P[2],sc[2],turn===2));hud();
    const finish=()=>{
      if(mode==='solo')c.end('🏆','You found them all!',`${tries} tries  ${tries<=9?'⭐⭐⭐':tries<=13?'⭐⭐':'⭐'}`,true);
      else if(sc[1]===sc[2])c.end('🤝','A tie!','3 pairs each. You are both great!',true);
      else{const w=sc[1]>sc[2]?1:2;c.end(P[w],P[w]+' wins!',`${P[1]} ${sc[1]} – ${sc[2]} ${P[2]}`,true)}
    };
    const picks=shuffle(ANIMALS.slice()).slice(0,6);
    shuffle([...picks,...picks]).forEach(e=>{
      const b=el('button','mcard',`<div class="mcard-in"><div class="face f-back"></div><div class="face f-front">${e}</div></div>`);
      b.onclick=()=>{
        if(lock||b.classList.contains('open'))return;
        sfx.tap();b.classList.add('open');open.push(b);
        if(open.length<2)return;
        tries++;lock=true;const [x,y]=open;open=[];
        if(x.firstChild.lastChild.textContent===y.firstChild.lastChild.textContent){
          c.after(()=>{x.classList.add('done');y.classList.add('done');sfx.good();pairs++;sc[turn]++;hud();lock=false;if(pairs===6)c.after(finish,500)},350);
        }else{
          c.after(()=>{sfx.bad();x.classList.add('shake');y.classList.add('shake')},500);
          c.after(()=>{x.classList.remove('open','shake');y.classList.remove('open','shake');turn=3-turn;hud();lock=false},1000);
        }
      };g.append(b)});
    c.after(()=>g.querySelectorAll('.mcard').forEach(x=>x.classList.add('open')),250);
    c.after(()=>{g.querySelectorAll('.mcard').forEach(x=>x.classList.remove('open'));lock=false},1700);
  });
}},

{id:'catdog',name:'Cat & Dog',icon:'🐱',bg:['#ffd60a','#ff9f0a'],init(c){
  const P={1:'🐱',2:'🐶'},L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const won=b=>L.find(([x,y,z])=>b[x]&&b[x]===b[y]&&b[x]===b[z]);
  modes(c,'🐱','🐶',mode=>{
    let b=Array(9).fill(0),turn=starts.catdog=3-(starts.catdog||2),over=false;
    c.el.innerHTML=`<div class="board">${'<button class="cell"></button>'.repeat(9)}</div>`;
    const cells=[...c.el.querySelectorAll('.cell')];
    const paint=()=>c.hud(pill(P[turn],mode==='cpu'?(turn===1?'You':'Robot'):'Go!'));
    const place=i=>{
      b[i]=turn;sfx.tap();cells[i].innerHTML=`<span>${P[turn]}</span>`;
      const w=won(b);
      if(w){over=true;w.forEach(k=>cells[k].classList.add('win'));c.after(()=>versusEnd(c,mode,turn,P,'catdog'),900);return}
      if(b.every(Boolean)){over=true;c.after(()=>c.end('🤝','A tie!','You are both great!',false),600);return}
      turn=3-turn;paint();if(mode==='cpu'&&turn===2)c.after(cpu,650);
    };
    const cpu=()=>{
      const free=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
      const can=p=>free.find(i=>{const t=b.slice();t[i]=p;return won(t)});
      let m=can(2);
      if(m===undefined&&Math.random()<.7)m=can(1);   // kid-friendly: it does not always block
      if(m===undefined&&!b[4]&&Math.random()<.5)m=4;
      if(m===undefined)m=pick(free);
      place(m);
    };
    cells.forEach((x,i)=>x.onclick=()=>{if(over||b[i]||(mode==='cpu'&&turn===2))return;place(i)});
    paint();if(mode==='cpu'&&turn===2)c.after(cpu,800);
  });
}},

{id:'chick',name:'Chick Pop',icon:'🐥',bg:['#7ee787','#30b158'],init(c){
  let score=0,left=30,on=false;
  const f=el('div','field');c.el.append(f);
  const hud=()=>c.hud(pill('🐥',score)+pill('⏱',left));hud();
  for(let i=0;i<9;i++){
    const h=el('button','hole','<div class="critter"></div>');
    h.addEventListener('pointerdown',()=>{
      if(!on||!h.classList.contains('up')||h.classList.contains('hit'))return;
      clearTimeout(h._t);const pts=+h.dataset.pts;score+=pts;hud();pts>1?sfx.good():sfx.pop();
      h.classList.add('hit');const b=el('div','burst','+'+pts);h.append(b);
      c.after(()=>{h.classList.remove('hit','up');b.remove()},380);
    });f.append(h);
  }
  const spawn=()=>{
    if(!on)return;
    const free=[...f.querySelectorAll('.hole:not(.up)')];
    if(free.length){
      const h=pick(free),gold=Math.random()<.12;
      h.firstChild.textContent=gold?'🌟':pick(['🐥','🐥','🐣','🐤']);h.dataset.pts=gold?3:1;h.classList.add('up');
      h._t=c.after(()=>h.classList.remove('up'),Math.max(900,1600-(30-left)*25));
    }
    c.after(spawn,Math.max(450,850-(30-left)*12));
  };
  c.countdown(()=>{on=true;spawn();
    c.every(()=>{left--;hud();if(left<=0){on=false;c.end('🐥',pl(score,'point')+'!',score>=30?'You are a superstar!':score>=18?'So fast!':'Getting better every time!',true,score)}},1000)});
}},

{id:'echo',name:'Color Echo',icon:'🎵',bg:['#ff6482','#ff375f'],init(c){
  const cols=['#0a84ff','#30d158','#ff9f0a','#ff375f'],notes=[330,392,494,587];
  const w=el('div','pads');c.el.append(w);
  let seq=[],pos=0,listen=false;
  const pads=cols.map((col,i)=>{const p=el('button','pad');p.style.background=col;
    p.addEventListener('pointerdown',()=>{
      if(!listen)return;flash(i);
      if(i!==seq[pos]){listen=false;sfx.bad();c.after(()=>c.end(seq.length>4?'🌟':'🙈',seq.length>4?'Great memory!':'Oops!',`You remembered ${seq.length-1} in a row`,seq.length>4,seq.length-1),500);return}
      if(++pos===seq.length){listen=false;c.after(round,900)}
    });w.append(p);return p});
  const flash=i=>{pads[i].classList.add('lit');tone([notes[i]],.3);c.after(()=>pads[i].classList.remove('lit'),300)};
  const round=()=>{
    seq.push(rnd(4));pos=0;c.hud(pill('⭐',seq.length-1));
    seq.forEach((n,k)=>c.after(()=>flash(n),500+k*600));
    c.after(()=>listen=true,500+seq.length*600-250);
  };
  c.hint('Watch, then copy');round();
}},


{id:'four',name:'Drop Four',icon:'🔴',bg:['#64d2ff','#0a84ff'],init(c){
  const P={1:'🔴',2:'🟡'};
  modes(c,'🔴','🟡',mode=>{
    let b=Array(42).fill(0),turn=starts.four=3-(starts.four||2),over=false;
    c.el.innerHTML=`<div class="d4">${'<button class="d4c"></button>'.repeat(42)}</div>`;
    const cells=[...c.el.querySelectorAll('.d4c')];
    const low=(col,bb)=>{for(let r=5;r>=0;r--)if(!bb[r*7+col])return r*7+col;return -1};
    const won=(bb,p)=>{
      for(let r=0;r<6;r++)for(let k=0;k<7;k++)for(const [dr,dk] of [[0,1],[1,0],[1,1],[1,-1]]){
        const line=[];
        for(let n=0;n<4;n++){const rr=r+dr*n,kk=k+dk*n;if(rr<0||rr>5||kk<0||kk>6||bb[rr*7+kk]!==p)break;line.push(rr*7+kk)}
        if(line.length===4)return line;
      }return null};
    const paint=()=>c.hud(pill(P[turn],mode==='cpu'?(turn===1?'You':'Robot'):'Go!'));
    const drop=col=>{
      const i=low(col,b);if(i<0)return;
      b[i]=turn;cells[i].classList.add('p'+turn);sfx.tap();
      const w=won(b,turn);
      if(w){over=true;w.forEach(k=>cells[k].classList.add('win'));c.after(()=>versusEnd(c,mode,turn,P,'four'),900);return}
      if(b.every(Boolean)){over=true;c.after(()=>c.end('🤝','A tie!','The board is full!',false),600);return}
      turn=3-turn;paint();if(mode==='cpu'&&turn===2)c.after(cpu,650);
    };
    const cpu=()=>{
      const free=[0,1,2,3,4,5,6].filter(k=>low(k,b)>=0);
      const can=p=>free.find(k=>{const t=b.slice();t[low(k,t)]=p;return won(t,p)});
      let m=can(2);
      if(m===undefined&&Math.random()<.8)m=can(1);
      if(m===undefined)m=pick(free.concat(free.filter(k=>k>1&&k<5)));
      drop(m);
    };
    cells.forEach((x,i)=>x.onclick=()=>{if(over||(mode==='cpu'&&turn===2))return;drop(i%7)});
    paint();c.hint('Get four in a row');if(mode==='cpu'&&turn===2)c.after(cpu,900);
  });
}},

{id:'snake',name:'Snack Snake',icon:'🐍',bg:['#7ee787','#1f8a43'],init(c){
  const W=11,H=9;let s=[{x:3,y:4},{x:2,y:4},{x:1,y:4}],d={x:1,y:0},nd=d,food,score=0;
  const bd=el('div','snk');c.el.append(bd);
  const put=()=>{do{food={x:rnd(W),y:rnd(H)}}while(s.some(p=>p.x===food.x&&p.y===food.y))};
  const at=p=>`left:${p.x/W*100}%;top:${p.y/H*100}%`;
  const draw=()=>bd.innerHTML=s.map((p,i)=>`<i class="${i?'sb':'sh'}" style="${at(p)}"></i>`).join('')+`<i style="${at(food)}">🍎</i>`;
  bd.addEventListener('pointerdown',e=>{
    const r=bd.getBoundingClientRect(),tx=(e.clientX-r.left)/r.width*W-.5-s[0].x,ty=(e.clientY-r.top)/r.height*H-.5-s[0].y;
    const hz={x:Math.sign(tx)||1,y:0},vt={x:0,y:Math.sign(ty)||1};
    nd=(Math.abs(tx)>Math.abs(ty)?[hz,vt]:[vt,hz]).find(v=>!(v.x===-d.x&&v.y===-d.y))||d;   // never reverse into itself
  });
  const step=()=>{
    d=nd;const h={x:(s[0].x+d.x+W)%W,y:(s[0].y+d.y+H)%H};
    if(s.slice(0,-1).some(p=>p.x===h.x&&p.y===h.y)){sfx.bad();return c.end('🐍',pl(score,'apple')+'!',score>=10?'What a long snake!':'Yum! Play again?',score>=5,score)}
    s.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;sfx.good();c.hud(pill('🍎',score));put()}else s.pop();
    draw();c.after(step,Math.max(180,340-score*8));
  };
  put();draw();c.hud(pill('🍎',0));c.hint('Tap where you want to go');c.after(step,900);
}},

{id:'spell',name:'Spell It',icon:'🔤',bg:['#63e6be','#30b158'],init(c){

    ['🐟','FISH'],['🐸','FROG'],['🦆','DUCK'],['⭐','STAR'],['🌙','MOON'],['🎂','CAKE'],['🐻','BEAR'],['🦁','LION'],['🌳','TREE'],['⛵','BOAT']];

    const extra=shuffle('ABDEHIKLMNOPRSTU'.split('').filter(x=>!word.includes(x))).slice(0,5-word.length);

  mk(blocks[0],0);spawn();c.hud(pill('🧱',0));c.hint('Tap to drop the block');
  w.addEventListener('pointerdown',()=>{
    if(!on||!cur)return;
    const p=blocks[blocks.length-1];let l=Math.max(cur.x,p.x),r=Math.min(cur.x+cur.w,p.x+p.w);

    };
    const award=(w,early)=>{
      state='idle';clearTimeout(goT);clearTimeout(botT);sc[w]++;hud();s[w-1].classList.add('won');
      sig.className='signal idle';sig.textContent=early?'🙈':I[w];
      if(early){sfx.bad();c.hint('Too soon!')}else sfx.good();
      if(sc[w]===3)c.after(()=>versusEnd(c,mode,w,P,'quick'),900);else c.after(round,1500);
    };
    const hit=p=>{if(state==='wait')award(3-p,true);else if(state==='go')award(p,false)};
    s[0].addEventListener('pointerdown',()=>hit(1));
    if(!cpu)s[1].addEventListener('pointerdown',()=>hit(2));
    hud();c.hint('Wait for GO, then tap!');c.after(round,900);
  },'Who taps first when it says GO?');
}},

{id:'boxes',name:'Box Battle',icon:'🔲',bg:['#b39dff','#5e5ce6'],init(c){
  const P={1:'🐱',2:'🐶'},COL={1:'#ff9f0a',2:'#0a84ff'};
  modes(c,'🐱','🐶',mode=>{
    const cpu=mode==='cpu',M=10,ST=80/3;
    const bd=el('div','boxes');c.el.innerHTML='';c.el.append(bd);
    const lines=[],owner=Array(9).fill(0),cells=[],sc={1:0,2:0};
    let turn=starts.boxes=3-(starts.boxes||2),over=false;
    for(let r=0;r<3;r++)for(let k=0;k<3;k++){const x=el('div','bx');x.style.cssText=`left:${M+k*ST}%;top:${M+r*ST}%;width:${ST}%;height:${ST}%`;bd.append(x);cells.push(x)}
    const add=(t,r,k)=>{
      const b=el('button','ln '+t,'<i></i>');
      b.style.cssText=`left:${M+k*ST}%;top:${M+r*ST}%;${t==='h'?'width':'height'}:${ST}%`;
      const L={b,taken:0,boxes:(t==='h'?[[r-1,k],[r,k]]:[[r,k-1],[r,k]]).filter(([y,x])=>y>=0&&y<3&&x>=0&&x<3).map(([y,x])=>y*3+x)};
      b.onclick=()=>{if(over||L.taken||(cpu&&turn===2))return;take(L)};lines.push(L);bd.append(b)};
    for(let r=0;r<4;r++)for(let k=0;k<3;k++)add('h',r,k);
    for(let r=0;r<3;r++)for(let k=0;k<4;k++)add('v',r,k);
    for(let r=0;r<4;r++)for(let k=0;k<4;k++){const d=el('i','dot');d.style.cssText=`left:${M+k*ST}%;top:${M+r*ST}%`;bd.append(d)}
    const sides=bi=>lines.filter(L=>L.taken&&L.boxes.includes(bi)).length;
    const hud=()=>c.hud(pill(P[1],sc[1],turn===1)+pill(cpu?'🤖':P[2],sc[2],turn===2));
    const take=L=>{
      L.taken=turn;L.b.firstChild.style.background=COL[turn];sfx.tap();
      let got=0;L.boxes.forEach(bi=>{if(!owner[bi]&&sides(bi)===4){owner[bi]=turn;cells[bi].textContent=cpu&&turn===2?'🤖':P[turn];cells[bi].style.background=COL[turn]+'33';sc[turn]++;got++}});
      if(got)sfx.good();
      if(sc[1]+sc[2]===9){over=true;hud();const w=sc[1]>sc[2]?1:2;c.after(()=>versusEnd(c,mode,w,P,'boxes'),800);return}
      if(!got)turn=3-turn;   // closing a box earns another go
      hud();if(cpu&&turn===2)c.after(bot,650);
    };
    const bot=()=>{
      const free=lines.filter(L=>!L.taken),win=free.filter(L=>L.boxes.some(bi=>sides(bi)===3)),safe=free.filter(L=>L.boxes.every(bi=>sides(bi)<2));
      take(pick(win.length?win:safe.length&&Math.random()<.85?safe:free));
    };
    hud();c.hint('Draw a line. Close a box to win it');
    if(cpu&&turn===2)c.after(bot,900);
  });
}},

{id:'guess',name:'Draw & Guess',icon:'✏️',bg:['#70d7ff','#5e5ce6'],init(c){
  const W=[['🐱','CAT'],['☀️','SUN'],['🏠','HOUSE'],['🌳','TREE'],['🐟','FISH'],['🚗','CAR'],['🌸','FLOWER'],['🍎','APPLE'],['⭐','STAR'],['⛵','BOAT'],['🎂','CAKE'],['⚽','BALL'],
    ['🎩','HAT'],['🌙','MOON'],['🐦','BIRD'],['🐌','SNAIL'],['🌈','RAINBOW'],['🤖','ROBOT'],['🍕','PIZZA'],['🦋','BUTTERFLY'],['🍦','ICE CREAM'],['⛄','SNOWMAN'],['🚀','ROCKET'],['🦆','DUCK']];
  const deck=shuffle(W.slice()),cols=['#1c1c1e','#ff375f','#30d158','#0a84ff'];let i=0,score=0,color=cols[0];
  c.el.innerHTML=`<div class="doodle"><div class="pal"><button class="chip peek">👀 Peek</button>${cols.map((x,k)=>`<button class="sw${k?'':' on'}" style="background:${x}" data-c="${x}" aria-label="Color"></button>`).join('')}<button class="chip ok">✓ Got it</button></div>
    <div class="cvwrap"><canvas></canvas><div class="secret"></div></div></div>`;
  const p=pad(c,c.el.querySelector('canvas'),()=>color),sec=c.el.querySelector('.secret'),peek=c.el.querySelector('.peek');
  const show=()=>sec.innerHTML=`<span>${deck[i][0]}</span>${deck[i][1]}`;
  c.el.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{sfx.tap();color=s.dataset.c;c.el.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===s))});
  peek.addEventListener('pointerdown',()=>sec.classList.add('show'));
  ['pointerup','pointercancel','pointerleave'].forEach(n=>peek.addEventListener(n,()=>sec.classList.remove('show')));
  c.el.querySelector('.ok').onclick=()=>{score++;sfx.good();c.hud(pill('⭐',score));i=(i+1)%deck.length;show();p.clear();c.hint('Swap! Now the other one draws',true)};
  show();c.hud(pill('⭐',0));c.hint('Hold Peek, draw it, let them guess',true);
}},

{id:'dice',name:'Dice Race',icon:'🎲',bg:['#7ee787','#00c7be'],init(c){
  const P={1:'🐸',2:'🐵'},N=14;
  modes(c,'🐸','🐵',mode=>{
    const cpu=mode==='cpu',I={1:P[1],2:cpu?'🤖':P[2]};
    c.el.innerHTML=`<div class="race"><div class="track cardbg"><b>${I[1]}</b><u>🏁</u></div><div class="track cardbg"><b>${I[2]}</b><u>🏁</u></div><button class="die">🎲</button></div>`;
    const run=c.el.querySelectorAll('.track b'),tr=c.el.querySelectorAll('.track'),die=c.el.querySelector('.die');
    let pos={1:0,2:0},turn=starts.dice=3-(starts.dice||2),busy=false,over=false;
    const hud=()=>{c.hud(pill(I[turn],cpu&&turn===2?'Robot':'Roll!'));tr.forEach((t,k)=>t.classList.toggle('on',k===turn-1))};
    const roll=()=>{
      if(busy||over)return;busy=true;let n=0;
      const iv=c.every(()=>{
        die.textContent=1+rnd(6);sfx.tap();
        if(++n<7)return;
        clearInterval(iv);const v=1+rnd(6);die.textContent=v;
        pos[turn]=Math.min(N,pos[turn]+v);run[turn-1].style.left=(pos[turn]/N*82)+'%';sfx.good();
        if(pos[turn]>=N){over=true;c.after(()=>versusEnd(c,mode,turn,P,'dice'),900);return}
        c.after(()=>{turn=3-turn;busy=false;die.textContent='🎲';hud();if(cpu&&turn===2)c.after(roll,600)},1000);
      },90);
    };
    die.onclick=()=>{if(cpu&&turn===2)return;roll()};
    hud();c.hint('Tap the dice. First to the flag wins');
    if(cpu&&turn===2)c.after(roll,1000);
  });
}},
];
/* Home screen order: the games families play together come first */
const ORDER=['catdog','four','flip','tug','quick','boxes','guess','dice','chick',
  'snake','fruit','stack','bee','bunny','echo','piano','doodle','trail',
  'slide','stars','odd','next','math','spell'];
G.sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));

/* ---------- Home screen: pages of 9 icons, swipe sideways like an Apple home screen ---------- */
const pager=$('#pager'),dots=$('#dots'),byId={};
G.forEach(g=>byId[g.id]=g);
for(let i=0;i<G.length;i+=9){
  const p=el('div','page');
  G.slice(i,i+9).forEach(g=>{
    const b=el('button','app',`<div class="icon" style="background:linear-gradient(160deg,${g.bg[0]},${g.bg[1]})">${g.icon}</div><div class="label">${g.name}</div>`);
    b.onclick=()=>{sfx.tap();location.hash=g.id};p.append(b)});
  pager.append(p);
  const d=el('i');d.onclick=()=>pager.scrollTo({left:pager.clientWidth*(i/9),behavior:'smooth'});dots.append(d);
}
const paintDots=()=>{const n=Math.round(pager.scrollLeft/(pager.clientWidth||1));[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===n))};
pager.addEventListener('scroll',paintDots,{passive:true});paintDots();

/* ---------- Running a game ---------- */
const play=$('#play'),hud=$('#hud');
let run=null,currentId=null;
function stopRun(){if(run){run.stop();run=null}}
function launch(id,again){
  stopRun();hideSheet();
  const g=byId[id];currentId=id;
  play.innerHTML='';hud.innerHTML='';$('#title').textContent=g.name;
  const timers=[],ivs=[];let raf=0,dead=false;
  const c={el:play,id,again:!!again,
    hud:h=>{if(!dead)hud.innerHTML=h},
    after:(f,ms)=>{const t=setTimeout(()=>{if(!dead)f()},ms);timers.push(t);return t},
    every:(f,ms)=>{const t=setInterval(()=>{if(!dead)f()},ms);ivs.push(t);return t},
    loop:f=>{let last=performance.now();const step=t=>{if(dead)return;const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;if(f(dt)!==false)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)},
    hint:(t,low)=>{const h=el('div','hint'+(low?' low':''),t);play.append(h);setTimeout(()=>h.remove(),3300)},
    countdown:cb=>{let n=3;const d=el('div','count','3');play.append(d);sfx.tap();
      const iv=c.every(()=>{n--;if(n>0){d.textContent=n;sfx.tap()}else{clearInterval(iv);d.remove();sfx.good();cb()}},750)},
    end:(emoji,title,text,party,score)=>{if(dead)return;c.stop();
      if(score!==undefined){let b=0;try{b=+localStorage.getItem('best-'+id)||0}catch(e){}
        if(score>b){try{localStorage.setItem('best-'+id,score)}catch(e){}if(b>0)text+='\n🎉 New best!'}else text+='\nBest: '+b}
      if(party){sfx.win();confetti()}showSheet(emoji,title,text,()=>launch(id,true))},
    stop:()=>{dead=true;timers.forEach(clearTimeout);ivs.forEach(clearInterval);cancelAnimationFrame(raf)}};
  run=c;g.init(c);
}
function show(id){
  const inGame=!!byId[id];
  $('#home').classList.toggle('hidden',inGame);$('#game').classList.toggle('hidden',!inGame);
  if(inGame)launch(id);else{stopRun();hideSheet();currentId=null;play.innerHTML=''}
}
const route=()=>show(location.hash.slice(1));
window.addEventListener('hashchange',route);
function goHome(){sfx.tap();if(location.hash)history.replaceState(null,'',location.pathname+location.search);show('')}
$('#backBtn').onclick=goHome;$('#sheetHome').onclick=goHome;
$('#againBtn').onclick=()=>{sfx.tap();if(currentId)launch(currentId)};
$('#sheetAgain').onclick=()=>{sfx.tap();hideSheet();againFn&&againFn()};

/* No pinch zoom or long-press menus, so little hands do not get lost */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

route();
})();
</script>
</body>
